[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-agent"
version = "0.1.0"
description = "Estimate, constrain, and execute document-research agent runs."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15"]

[project.urls]
Homepage = "https://pkm100.github.io/spawn/"
Repository = "https://github.com/PKM100/spawn"
Issues = "https://github.com/PKM100/spawn/issues"

[project.optional-dependencies]
dev = ["ruff>=0.11"]
copilot = ["github-copilot-sdk==1.0.34"]

[project.scripts]
spawn = "spawn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spawn.templates" = ["*.toml", "*.json", "*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
